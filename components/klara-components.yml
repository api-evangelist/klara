  https://support.klara.com/en/articles/762973-set-up-klara-web-messenger,
  live probes of widget.klara.com
note: >-
  Klara ships client-side embeddable surfaces even though it publishes no developer
  API. The marquee one is the Klara Web Messenger — a JavaScript snippet a practice
  pastes into the footer of its own website so patients can start a conversation
  without logging in. It is a genuine embeddable component and Klara treats it as a
  first-class service (its own component, "Klara Website Widget", on the status page),
  but the embed code is issued only to authenticated practices: widget.klara.com 302s
  to the doctor.klara.com authorization flow, and every script path under it answers
  401. The snippet itself is therefore not publicly readable and is NOT reproduced or
  guessed here.
