note: >-
  Klara is a HIPAA-compliant patient-communication platform that acts as a HIPAA
  business associate for the medical practices it serves; secure messaging, PHI
  handling, and encryption in transit and at rest are core, publicly stated
  posture. Klara publishes no self-serve public API, so API-level cross-cutting
  standards (OAuth2/OIDC, FHIR, RFC 9457) are not applicable to the Klara product
  itself. The ONC-certified HL7 FHIR R4 / SMART-on-FHIR surface belongs to the
  parent ModMed EHR products (portal.api.modmed.com), not to Klara messaging.
