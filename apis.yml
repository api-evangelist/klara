name: Klara
kind: company
description: >-
  Klara is a US healthcare patient-engagement and communication platform, now part of
  Modernizing Medicine (ModMed), that gives medical practices two-way secure messaging,
  patient texting, appointment reminders and scheduling, intake and forms, telemedicine,
  and automated workflow tools to reduce phone volume and staff workload. Klara markets
  integration with 50+ EHR and practice-management systems, but it does not publish its
  own self-serve public developer API, FHIR CapabilityStatement, or downloadable OpenAPI.
  Its parent, ModMed, operates a partner-gated developer program at portal.api.modmed.com
  covering an ONC-certified HL7 FHIR R4 API with SMART-on-FHIR (built for the 21st Century
  Cures Act, US Core, OAuth2, bulk NDJSON export) plus a proprietary FHIR API for the EMA
  and gGastro EHR/PM platforms and a Synapsys App Marketplace. That certified API surface
  belongs to ModMed's EHR products, not to the Klara messaging product itself. Home market
  is the United States.
