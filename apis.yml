  state: gated
  reason: marketplace-only
  detail: >-
    Klara has no developer site of its own — developers.klara.com, docs.klara.com and
    developer.klara.com do not resolve in DNS, klara.com 302s every path to the ModMed
    product page, and the live first-party API host api.klara.com 404s every discovery
    path because it is the private backend for doctor.klara.com; the only Klara
    integration surface published anywhere is a partner-app listing inside ModMed's
    synapSYS marketplace, backed by the parent's portal.api.modmed.com FHIR/EMA APIs.
